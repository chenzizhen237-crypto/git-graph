name: Release

# Releases are normally made locally on Jimmy's Mac mini with scripts/release.sh
# (`jimmy-test --ref main -- pnpm release`). This is the manual fallback: it builds
# the macOS app only (Apple Silicon and Intel) and publishes it as the latest release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.6.0 (created at the selected branch if it doesn't exist)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            target: aarch64-apple-darwin
          - name: macOS Intel
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Builds the app and installers, and uploads them to a draft release for this tag.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Git Graph ${{ inputs.tag }}
          releaseBody: See the notes below for what is new and how to install.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app,dmg

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish the draft with the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then gh release edit "$TAG" --notes-file "$notes"; fi
          gh release edit "$TAG" --draft=false --latest
